<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Orario DADA</title>
  <meta name="description" content="Orario delle lezioni: classi, docenti e aule.">
  <meta name="theme-color" content="#1c56b8">
  <!-- Installazione come app (Android, Windows, iPhone/iPad) -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone/icona.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Orario">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <a class="salta" href="#contenuto">Vai all'orario</a>

  <!-- Messaggio di caricamento / errore -->
  <div id="caricamento" class="caricamento" role="status">Caricamento…</div>

  <!-- ===== Schermata di accesso ===== -->
  <main id="schermataAccesso" class="accesso" hidden aria-labelledby="titoloAccesso">
    <div class="scheda-accesso">
      <img src="icone/icona.svg" alt="" width="72" height="72">
      <h1 id="titoloAccesso">Orario DADA</h1>
      <p>Accedi con il tuo account della scuola <strong id="dominioAccesso"></strong></p>

      <label class="ricordami">
        <input type="checkbox" id="ricordami" checked>
        Ricordami su questo dispositivo
      </label>

      <!-- Qui Google disegna il pulsante "Accedi con Google" -->
      <div id="pulsanteGoogle" class="pulsante-google"></div>

      <!-- Modalità dimostrativa: si vede solo se manca l'ID client di Google in config.js -->
      <form id="moduloDemo" class="modulo-demo" hidden novalidate>
        <p class="avviso-demo"><strong>Modalità dimostrativa.</strong> L'accesso con Google non è ancora configurato: l'indirizzo non viene verificato.</p>
        <label for="emailDemo">Email della scuola</label>
        <input type="email" id="emailDemo" autocomplete="email" inputmode="email" required>
        <button type="submit" class="pulsante primario">Entra</button>
      </form>

      <p id="erroreAccesso" class="errore" role="alert"></p>
    </div>
  </main>

  <!-- ===== App ===== -->
  <div id="app" hidden>
    <header class="barra">
      <button type="button" id="btnHome" class="marchio" aria-label="Torna alla schermata iniziale">
        <img src="icone/icona.svg" alt="" width="32" height="32">
        <span class="testo-marchio">
          <span class="nome-app">Orario</span>
          <span id="infoScuola" class="info-scuola"></span>
        </span>
      </button>
      <span id="titoloMonitor" class="titolo-monitor"></span>
      <div class="azioni-barra">
        <span id="orologio" class="orologio"></span>
        <button type="button" id="btnMioOrario" class="pulsante" hidden>Il mio orario</button>
        <button type="button" id="btnOggi" class="pulsante">Oggi</button>
        <button type="button" id="btnUtente" class="pulsante-utente" aria-haspopup="true" aria-expanded="false" aria-controls="menu"></button>
      </div>
      <!-- Menu dell'utente -->
      <div id="menu" class="menu" hidden>
        <p class="utente"><strong id="nomeUtente"></strong><br><span id="emailUtente"></span></p>
        <label for="sceltaMonitor">Questo dispositivo è il monitor dell'aula:</label>
        <select id="sceltaMonitor"></select>
        <button type="button" id="btnSchermoIntero" class="voce-menu">Schermo intero</button>
        <button type="button" id="btnRicarica" class="voce-menu">Aggiorna l'orario</button>
        <button type="button" id="btnEsci" class="voce-menu">Esci</button>
      </div>
    </header>

    <!-- Scelta di cosa vedere -->
    <nav class="controlli" aria-label="Scelta della visualizzazione">
      <div class="riga-controlli">
        <div class="gruppo-colonne" role="group" aria-labelledby="etichettaColonne">
          <span id="etichettaColonne" class="etichetta-controllo">In colonna</span>
          <div class="segmenti">
            <button type="button" data-colonne="classe" aria-pressed="false">Classi</button>
            <button type="button" data-colonne="docente" aria-pressed="false">Docenti</button>
            <button type="button" data-colonne="aula" aria-pressed="false">Aule</button>
            <button type="button" data-colonne="giorno" aria-pressed="false">Settimana</button>
          </div>
        </div>
        <div class="filtri" role="group" aria-label="Filtri">
          <label>Classe <select id="filtro-classe"></select></label>
          <label>Docente <select id="filtro-docente"></select></label>
          <label>Aula <select id="filtro-aula"></select></label>
          <button type="button" id="btnAzzera" class="pulsante leggero">Azzera filtri</button>
        </div>
      </div>
      <div id="giorni" class="giorni" role="group" aria-label="Giorno"></div>
    </nav>

    <main id="contenuto" tabindex="-1">
      <div id="adesso" class="adesso" aria-live="polite" hidden></div>
      <p id="avviso" class="avviso" role="status" hidden></p>
      <div id="contenitoreTabella" class="contenitore-tabella" tabindex="0" role="region" aria-labelledby="didascalia">
        <table id="tabella" class="tabella-orario"></table>
      </div>
    </main>
    <footer id="piede" class="piede"></footer>
  </div>

  <script src="js/config.js"></script>
  <script src="js/dati.js"></script>
  <script src="js/accesso.js"></script>
  <script src="js/viste.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
