<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Versione "piena" dell'icona: sfondo fino ai bordi e robot più piccolo, perché Android e iPhone
       ritagliano da soli la forma (cerchio, goccia, quadrato arrotondato) -->
  <defs>
    <linearGradient id="sfondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f6fe0"/><stop offset="1" stop-color="#153c8f"/>
    </linearGradient>
    <clipPath id="bordo"><rect width="512" height="512"/></clipPath>
  </defs>
  <rect width="512" height="512" fill="url(#sfondo)"/>
  <g clip-path="url(#bordo)"><g transform="translate(256 262) scale(.76) translate(-256 -256)">
  <!-- corpo, con l'orologio sul petto (è l'app dell'orario) -->
  <rect x="150" y="392" width="212" height="320" rx="56" fill="#dfe8fb"/>
  <circle cx="256" cy="456" r="36" fill="#ffcf3f"/>
  <path d="M256 434v24l16 11" stroke="#163f96" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- antenna -->
  <rect x="247" y="96" width="18" height="64" rx="9" fill="#dfe8fb"/>
  <circle cx="256" cy="86" r="27" fill="#ffcf3f"/>
  <circle cx="247" cy="77" r="8" fill="#fff4c2"/>
  <!-- orecchie -->
  <rect x="90" y="232" width="42" height="100" rx="19" fill="#ffcf3f"/>
  <rect x="380" y="232" width="42" height="100" rx="19" fill="#ffcf3f"/>
  <!-- testa -->
  <rect x="114" y="148" width="284" height="250" rx="74" fill="#ffffff"/>
  <!-- schermo del viso -->
  <rect x="148" y="186" width="216" height="172" rx="58" fill="#10275a"/>
  <!-- occhi, con il riflesso di luce -->
  <ellipse cx="211" cy="254" rx="23" ry="27" fill="#7fe7ff"/>
  <ellipse cx="301" cy="254" rx="23" ry="27" fill="#7fe7ff"/>
  <circle cx="219" cy="244" r="8" fill="#ffffff"/>
  <circle cx="309" cy="244" r="8" fill="#ffffff"/>
  <!-- guance -->
  <circle cx="178" cy="306" r="14" fill="#ff8fb1" opacity=".9"/>
  <circle cx="334" cy="306" r="14" fill="#ff8fb1" opacity=".9"/>
  <!-- sorriso -->
  <path d="M214 300 Q256 338 298 300" stroke="#7fe7ff" stroke-width="13" stroke-linecap="round" fill="none"/>
  </g></g>
</svg>
